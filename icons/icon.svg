<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <!-- Dark background matching the extension's dark theme -->
  <rect width="100" height="100" rx="15" fill="#111118" stroke="#2a2a3a" stroke-width="1.5"/>

  <!-- Outer M — Green (activated macros) -->
  <polyline
    points="8,92 8,8 50,54 92,8 92,92"
    fill="none"
    stroke="#3dab6a"
    stroke-width="11"
    stroke-linejoin="miter"
    stroke-linecap="square"/>

  <!-- Middle M — Dark Blue (edit buttons) -->
  <polyline
    points="25,77 25,25 50,51.5 75,25 75,77"
    fill="none"
    stroke="#3558a0"
    stroke-width="9"
    stroke-linejoin="miter"
    stroke-linecap="square"/>

  <!-- Inner M — Red (delete buttons) -->
  <polyline
    points="37,65 37,37 50,49.5 63,37 63,65"
    fill="none"
    stroke="#b83c3c"
    stroke-width="7"
    stroke-linejoin="miter"
    stroke-linecap="square"/>
</svg>
